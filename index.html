
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#493022">

  <title>Хранитель песков — Лабораторная №6</title>

  <!-- Подключение Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "./three-shim.js",
      "three-real": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js"
    }
  }
  </script>

  <!-- Просмотр 3D-модели -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js">
  </script>

  <!-- Визуальные эффекты -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects@1.5.0/dist/model-viewer-effects.min.js">
  </script>

  <style>
    :root {
      --brown: #493022;
      --brown-light: #60432E;
      --brown-deep: #352116;
      --gold: #D9B78B;
      --cream: #F6E9D4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--brown);
      color: var(--cream);
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(96%, 1200px);
      margin: 0 auto;
      padding: 42px 0 25px;
    }

    /* Заголовок */

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .eyebrow {
      margin: 0 0 17px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: normal;
    }

    .subtitle {
      margin: 16px 0 0;
      color: var(--gold);
      font-size: 15px;
    }

    /* Область модели */

    .viewer-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid #92704D;
      background: var(--brown-light);
      box-shadow: 0 25px 55px rgba(0,0,0,.22);
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 610px;

      background: radial-gradient(
        ellipse at 50% 42%,
        #806148 0%,
        #684B36 50%,
        #493022 100%
      );

      --poster-color: transparent;
    }

    /* Панели управления */

    .panel {
      position: absolute;
      top: 24px;
      z-index: 10;
      width: 195px;
      padding: 17px;
      border-radius: 16px;
      background: rgba(53,33,22,.91);
      border: 1px solid rgba(217,183,139,.4);
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .panel-left {
      left: 24px;
    }

    .panel-right {
      right: 24px;
    }

    .panel h2 {
      margin: 0 0 14px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: normal;
    }

    .panel button {
      display: block;
      width: 100%;
      margin: 8px 0 0;
      padding: 11px 9px;
      background: #765238;
      border: 1px solid #A47B54;
      border-radius: 9px;
      color: var(--cream);
      font-size: 12px;
      cursor: pointer;
      transition: background .2s;
    }

    .panel button:hover:not(:disabled) {
      background: #98704C;
    }

    .panel button.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--brown-deep);
      font-weight: bold;
    }

    .panel button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .panel-note {
      margin: 13px 0 0;
      color: var(--gold);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* Кнопка дополненной реальности */

    .ar-button {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;

      padding: 13px 24px;
      border: 1px solid var(--gold);
      border-radius: 12px;

      background: var(--brown);
      color: var(--cream);

      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;

      box-shadow: 0 5px 18px rgba(0,0,0,.2);
    }

    .ar-button:hover {
      background: #765238;
    }

    /* Загрузка */

    .loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--cream);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    /* Подпись */

    footer {
      padding: 30px 0 20px;
      text-align: center;
    }

    footer p {
      margin: 0;
      font-size: 13px;
    }

    footer .small {
      margin-top: 9px;
      color: var(--gold);
      font-size: 11px;
    }

    /* Мобильная версия */

    @media (max-width: 760px) {
      .container {
        padding-top: 35px;
      }

      .viewer-card {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px;
        border-radius: 18px;
      }

      model-viewer {
        order: 0;
        flex-basis: 100%;
        height: 440px;
        border-radius: 12px;
      }

      .loading {
        top: 210px;
      }

      .panel {
        position: static;
        width: calc(50% - 6px);
        padding: 12px;
        order: 1;
      }

      .panel h2 {
        font-size: 17px;
      }

      .panel button {
        font-size: 11px;
      }

      .subtitle {
        font-size: 13px;
      }

      .ar-button {
        bottom: 18px;
        font-size: 12px;
        padding: 11px 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <p class="eyebrow">
        ИНТЕРАКТИВНАЯ 3D-ГАЛЕРЕЯ
      </p>

      <h1>Хранитель песков</h1>

      <p class="subtitle">
        Маленький герой большой истории
      </p>
    </header>

    <section class="viewer-card">

      <!-- Панель анимаций -->

      <div class="panel panel-left">

        <h2>Анимация</h2>

        <button id="playPause" disabled>
          Воспроизвести
        </button>

        <button id="nextAnimation" disabled>
          Следующая анимация
        </button>

        <p class="panel-note" id="animationInfo">
          Проверяем анимации...
        </p>

      </div>

      <!-- Панель эффектов -->

      <div class="panel panel-right">

        <h2>Эффекты</h2>

        <button id="pixelate">
          Pixelate
        </button>

        <button id="glitch">
          Glitch
        </button>

        <button id="resetEffects">
          Сбросить эффекты
        </button>

      </div>

      <!-- 3D-модель -->

      <model-viewer
        id="model"

        src="./3b865256ca794dbda6df29d9bf047c55.glb"

        alt="3D-модель Хранителя песков"

        camera-controls
        touch-action="pan-y"

        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="20deg"

        interaction-prompt="none"

        shadow-intensity="1.34"
        shadow-softness="0.76"
        exposure="1.29"

        camera-orbit="164.9deg 82.04deg 3.304m"
        field-of-view="30deg"

        ar
        ar-modes="webxr scene-viewer quick-look">

        <!-- Эффекты постобработки -->

        <effect-composer id="composer">
        </effect-composer>

        <!-- Кнопка AR -->

        <button
          slot="ar-button"
          class="ar-button"
          type="button">
          ◈ Посмотреть в AR
        </button>

      </model-viewer>

      <div class="loading" id="loading">
        Загрузка 3D-модели...
      </div>

    </section>

    <footer>

      <p>Лабораторная работа №6</p>

      <p class="small">
        Анимация, визуальные эффекты и дополненная реальность
      </p>

    </footer>

  </main>

  <script type="module">

    const model =
      document.getElementById("model");

    const loading =
      document.getElementById("loading");

    const playPause =
      document.getElementById("playPause");

    const nextAnimation =
      document.getElementById("nextAnimation");

    const animationInfo =
      document.getElementById("animationInfo");

    const pixelateButton =
      document.getElementById("pixelate");

    const glitchButton =
      document.getElementById("glitch");

    const resetButton =
      document.getElementById("resetEffects");

    const composer =
      document.getElementById("composer");

    let animations = [];
    let animationIndex = 0;

    let pixelateEnabled = false;
    let glitchEnabled = false;

    /* Загрузка модели */

    function initializeModel() {

      loading.classList.add("hidden");

      animations = model.availableAnimations || [];

      if (animations.length === 0) {

        animationInfo.textContent =
          "В модели нет встроенных анимаций.";

        return;
      }

      animationIndex = 0;

      model.animationName = animations[0];
      model.play();

      playPause.disabled = false;

      nextAnimation.disabled =
        animations.length < 2;

      playPause.textContent = "Пауза";

      updateAnimationInfo();
    }

    model.addEventListener("load", initializeModel);

    model.addEventListener("error", event => {

      loading.textContent =
        "Не удалось загрузить 3D-модель.";

      console.error(
        "Ошибка загрузки модели:",
        event
      );

    });

    if (model.loaded) {
      initializeModel();
    }

    /* Управление анимациями */

    function updateAnimationInfo() {

      animationInfo.textContent =
        "Анимация " +
        (animationIndex + 1) +
        " из " +
        animations.length +
        ": " +
        animations[animationIndex];

    }

    playPause.addEventListener("click", () => {

      if (model.paused) {

        model.play();
        playPause.textContent = "Пауза";

      } else {

        model.pause();
        playPause.textContent = "Воспроизвести";

      }

    });

    nextAnimation.addEventListener("click", () => {

      if (animations.length < 2) return;

      animationIndex =
        (animationIndex + 1) % animations.length;

      model.animationName =
        animations[animationIndex];

      model.play();

      playPause.textContent = "Пауза";

      updateAnimationInfo();

    });

    /* Визуальные эффекты */

    function updateEffects() {

      composer.replaceChildren();

      if (pixelateEnabled) {

        const pixelate =
          document.createElement("pixelate-effect");

        pixelate.setAttribute(
          "granularity", "32"
        );

        composer.appendChild(pixelate);

      }

      if (glitchEnabled) {

        const glitch =
          document.createElement("glitch-effect");

        glitch.setAttribute(
          "mode", "constant"
        );

        composer.appendChild(glitch);

      }

      pixelateButton.classList.toggle(
        "active",
        pixelateEnabled
      );

      glitchButton.classList.toggle(
        "active",
        glitchEnabled
      );

    }

    pixelateButton.addEventListener("click", () => {

      pixelateEnabled = !pixelateEnabled;
      updateEffects();

    });

    glitchButton.addEventListener("click", () => {

      glitchEnabled = !glitchEnabled;
      updateEffects();

    });

    resetButton.addEventListener("click", () => {

      pixelateEnabled = false;
      glitchEnabled = false;

      updateEffects();

    });

  </script>

</body>
</html>
