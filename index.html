
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#493022">

  <title>Хранитель песков — 3D-галерея</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>

  <style>
    :root {
      --brown: #493022;
      --brown-light: #60432E;
      --brown-deep: #352116;
      --gold: #D9B78B;
      --cream: #F6E9D4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--brown);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--brown);
      color: var(--cream);
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(94%, 1050px);
      margin: 0 auto;
      padding: 48px 0 25px;
    }

    /* Заголовок */

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .eyebrow {
      margin: 0 0 17px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: normal;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 16px 0 0;
      color: var(--gold);
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    /* Область 3D-модели */

    .viewer-card {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid #92704D;
      border-radius: 24px;
      background: var(--brown-light);
      box-shadow:
        0 25px 55px rgba(0, 0, 0, 0.22);
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 590px;

      background: radial-gradient(
        ellipse at 50% 42%,
        #806148 0%,
        #684B36 50%,
        #493022 100%
      );

      --poster-color: transparent;
    }

    /* Загрузка модели */

    .loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--cream);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    .loading.hidden {
      display: none;
    }

    /* Подпись */

    footer {
      padding: 30px 0 20px;
      text-align: center;
    }

    .footer-main {
      margin: 0;
      color: var(--cream);
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .footer-sub {
      margin: 9px 0 0;
      color: var(--gold);
      font-size: 11px;
    }

    /* Адаптация под телефон */

    @media (max-width: 600px) {
      .container {
        padding-top: 35px;
      }

      header {
        margin-bottom: 25px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 13px;
      }

      model-viewer {
        height: 440px;
      }

      .viewer-card {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>

      <p class="eyebrow">
        Интерактивная 3D-галерея
      </p>

      <h1>Хранитель песков</h1>

      <p class="subtitle">
        Маленький герой большой истории
      </p>

    </header>

    <!-- Трёхмерная модель персонажа -->

    <section class="viewer-card">

      <model-viewer
        id="model"
        src="./3b865256ca794dbda6df29d9bf047c55.glb"
        alt="Трёхмерная модель Хранителя песков"

        camera-controls
        touch-action="pan-y"

        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="20deg"

        interaction-prompt="none"

        autoplay

        tone-mapping="neutral"
        shadow-intensity="1.34"
        shadow-softness="0.76"
        exposure="1.29"

        camera-orbit="164.9deg 82.04deg 3.304m"
        field-of-view="30deg"

        ar
        ar-modes="webxr scene-viewer quick-look">

      </model-viewer>

      <div class="loading" id="loading">
        Загрузка 3D-модели...
      </div>

    </section>

    <footer>

      <p class="footer-main">
        Лабораторная работа №5
      </p>

      <p class="footer-sub">
        Интерактивная визуализация трёхмерной модели
      </p>

    </footer>

  </main>

  <script>
    const model = document.getElementById("model");
    const loading = document.getElementById("loading");

    model.addEventListener("load", () => {
      loading.classList.add("hidden");
    });

    model.addEventListener("error", (event) => {
      loading.textContent =
        "Не удалось загрузить 3D-модель.";

      console.error(
        "Ошибка загрузки модели:",
        event
      );
    });

    if (model.loaded) {
      loading.classList.add("hidden");
    }
  </script>

</body>
</html>
